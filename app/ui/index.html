<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<title>字幕封装助手 · ASS Subtitle Packaging Tool</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="single-active">

<div id="offlineBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:300;background:var(--err-bg);border-bottom:1px solid var(--err-line);color:var(--danger);font:13px/1.6 var(--sans);text-align:center;padding:8px 40px;backdrop-filter:blur(4px);">
  <b>服务未运行</b> — 请双击 <span style="font-family:var(--mono)">start_mux_ui.bat</span> 重新启动后端；恢复后本提示自动消失。
</div>

<header class="app-header">
  <div class="container header-inner">
    <div class="brand">
      <span class="brand-mark" data-ic="clapperboard" aria-hidden="true"></span>
      <div class="brand-text">
        <h1 class="brand-name">字幕封装助手</h1>
        <div class="brand-sub">ASS Subtitle Packaging Tool · 拖入文件自动识别 · 简体中文默认轨道 · zh-Hans / zh-Hant · MKV 封装</div>
      </div>
    </div>
    <div class="header-right">
      <div id="status" role="status" aria-live="polite">连接中…</div>
      <div class="settings">
        <button class="btn ghost icon-btn" id="btnSettings" aria-label="设置" aria-haspopup="true" aria-expanded="false"><span data-ic="sliders" aria-hidden="true"></span></button>
        <div class="settings-pop" id="settingsPop"></div>
      </div>
    </div>
  </div>
</header>

<nav class="mode-nav" aria-label="功能模式">
  <div class="container nav-inner">
    <button type="button" class="mode-tab active" data-mode="single" onclick="switchMode('single')"><span data-ic="clapperboard" aria-hidden="true"></span>单个封装</button>
    <button type="button" class="mode-tab" data-mode="batch" onclick="switchMode('batch')"><span data-ic="layers" aria-hidden="true"></span>批量封装</button>
    <div class="nav-drop" id="toolsDrop">
      <button type="button" class="mode-tab" data-mode="tools" id="toolsTab" aria-haspopup="true" aria-expanded="false"><span data-ic="captions" aria-hidden="true"></span>字幕工具<span class="drop-chev" data-ic="chevronDown" aria-hidden="true"></span></button>
      <div class="drop-menu" id="toolsMenu" role="menu" aria-label="字幕工具">
        <button type="button" class="drop-item" data-mode="preview" role="menuitem" onclick="switchMode('preview')"><span data-ic="image" aria-hidden="true"></span>字幕预览</button>
        <button type="button" class="drop-item" data-mode="extract" role="menuitem" onclick="switchMode('extract')"><span data-ic="download" aria-hidden="true"></span>字幕提取</button>
        <button type="button" class="drop-item" data-mode="propedit" role="menuitem" onclick="switchMode('propedit')"><span data-ic="shieldCheck" aria-hidden="true"></span>快速修补</button>
      </div>
    </div>
  </div>
</nav>

<main class="main">
  <div class="container main-inner">
    <div id="pageRoot">
      <div id="pageLoading" class="page-loading t-sec">正在加载界面…</div>
    </div>
    <div id="consoleRoot"></div>
  </div>
</main>

<div id="modalRoot"></div>

<!-- App Shell：业务界面在 pages/ 与 partials/ 中，由 loader.js 启动时一次性并行加载挂载，
     之后按原顺序注入执行业务脚本（app → identify → task → batch → extract → preview → propedit → env → init） -->
<script src="loader.js"></script>
</body>
</html>
